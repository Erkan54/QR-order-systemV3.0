<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>QR Sipariş</title>
  <link rel="stylesheet" href="css/style.css" />
  <script>
    // --- EN KOLAY: file:// veya yanlış port ise backend'e taşı ---
    (function ensureSameOrigin(){
      var DEFAULT_ORIGIN = window.location.origin;
      var u = new URL(location.href);
      var api = u.searchParams.get("api");
      if (api) sessionStorage.setItem("api_origin", api);

      var target = sessionStorage.getItem("api_origin") || DEFAULT_ORIGIN;

      try{
        var to = new URL(target);
        if (location.protocol === "file:" || (to.origin !== location.origin)) {
          var file = (location.pathname.split("/").pop() || "index.html");
          var qs = location.search; var hs = location.hash;
          location.replace(to.origin + "/" + file + qs + hs);
        }
      }catch(e){}
    })();
  </script>
</head>

<body>
  <header>
  <div class="container header-row">
    <div class="brand">🍽️ QR Sipariş</div>
    <div class="header-right">
      <div class="masa-chip">Masa: <span id="masa-chip">—</span></div>
      <button id="goCartBtn" class="header-cart-btn">🛒</button>
    </div>
  </div>

  <div class="container">
    <div id="category-nav" class="category-nav"></div>
  </div>
</header>
  <!-- Kategori Navigasyonu -->
  <div class="container">
    <div id="category-nav" class="category-nav"></div>
  </div>

  <main class="container">


  <main class="container">
    <div class="app-grid">
      <!-- SOL: Menü -->
      <section aria-label="Menü">
        <div id="menu"></div>
      </section>

      <!-- SAĞ: Sepet ve Kampanyalar -->
      <aside aria-label="Sepet" class="panel" id="cart-panel">
        <div class="panel-header">Sepet</div>
        <div class="panel-body">
          <!-- Kampanyalarım -->
          <div class="mb-10">
            <label for="kampanyaSelect" class="block-lbl">🎁 Kampanyalarım</label>
            <select id="kampanyaSelect">
              <option value="">Kampanya seç (opsiyonel)</option>
            </select>
            <small class="muted">Giriş yaptıysanız haklarınız burada listelenir.</small>
          </div>

          <!-- Sepet satırları -->
          <div id="cart-items"></div>

          <!-- Özet -->
          <div class="mt-10">
            <table class="summary-table">
              <tr>
                <td>Ara Toplam</td>
                <td id="ara-toplam" class="text-right">0.00 ₺</td>
              </tr>
              <tr id="indirim-row" class="hidden">
                <td>İndirim</td>
                <td id="indirim-tutar" class="text-right"></td>
              </tr>
              <tr>
                <td><strong>Toplam</strong></td>
                <td id="genel-toplam" class="text-right"><strong>0.00 ₺</strong></td>
              </tr>
            </table>
          </div>

          <!-- Sipariş Ver -->
          <div class="actions-row">
            <button id="siparisVerBtn" class="btn primary">Sipariş Ver</button>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <!-- Sağ altta kullanıcı rozeti -->
  <div id="user-badge" class="user-badge hidden">
    <div id="ub-name" class="user-badge__name">—</div>
    <div class="user-badge__points"><span id="ub-puan">0</span> puan</div>
  </div>

  <!-- cache-bust için v paramı -->
  <script src="script.js?v=4" defer></script>
</body>
</html>
